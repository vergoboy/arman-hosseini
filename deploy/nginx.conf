# /etc/nginx/sites-available/arman-hosseini.ir
# `current` is the symlink the admin service flips after every successful build.
#
# certbot runs in webroot mode (certbot.timer, HTTP-01 against /opt/arman-hosseini),
# so :80 keeps the acme-challenge location instead of a blanket redirect.
# `listen ... http2` (not `http2 on;`) because this server runs nginx 1.24.
#
# NOTE: nginx does NOT inherit server-level add_header into a location that
# declares its own add_header, so every security header is repeated in the
# locations below — otherwise HTML/asset responses ship without HSTS/nosniff.

server {
    listen 80;
    listen [::]:80;
    server_name arman-hosseini.ir www.arman-hosseini.ir;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/arman-hosseini;
        default_type text/plain;
    }

    location / {
        return 301 https://arman-hosseini.ir$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name arman-hosseini.ir;

    ssl_certificate     /etc/letsencrypt/live/arman-hosseini.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arman-hosseini.ir/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/arman-hosseini/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/xml application/rss+xml application/manifest+json image/svg+xml text/plain;
    gzip_min_length 512;
    # brotli on;   brotli_types ...;   (if ngx_brotli is installed)

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hashed assets never change.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }
    location /media/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri =404;
    }

    # HTML: always revalidate so a publish is visible immediately.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/index.html =404;
    }

    # Language-aware 404 pages.
    error_page 404 /404.html;
    location /fa/ {
        error_page 404 /fa/404/index.html;
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location = /404.html { internal; }
    location = /fa/404/index.html { internal; }

    # Admin dashboard + API (Node service on loopback). Keep it off search engines and out of caches.
    location /admin { proxy_pass http://127.0.0.1:4322; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
    location /api/  { client_max_body_size 40m; proxy_pass http://127.0.0.1:4322; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
}
