# /etc/nginx/sites-available/arman-hosseini.ir
# `current` is the symlink the admin service flips after every successful build.
server {
    listen 80;
    listen [::]:80;
    server_name arman-hosseini.ir www.arman-hosseini.ir;
    return 301 https://arman-hosseini.ir$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name arman-hosseini.ir;
    # ssl_certificate / ssl_certificate_key: managed by certbot

    root /opt/arman-hosseini/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/xml application/rss+xml application/manifest+json image/svg+xml text/plain;
    gzip_min_length 512;
    # brotli on; brotli_types ...;   (if ngx_brotli is installed)

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Hashed assets never change.
    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location /assets/ { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }
    location /media/  { add_header Cache-Control "public, max-age=2592000"; try_files $uri =404; }

    # HTML: always revalidate so a publish is visible immediately.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Language-aware 404 pages.
    error_page 404 /404.html;
    location /fa/ { error_page 404 /fa/404/index.html; try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }
    location = /404.html { internal; }
    location = /fa/404/index.html { internal; }

    # Admin dashboard + API (Node service on loopback). Keep it off search engines and out of caches.
    location /admin { proxy_pass http://127.0.0.1:4322; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
    location /api/  { client_max_body_size 40m; proxy_pass http://127.0.0.1:4322; include /etc/nginx/proxy_params; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Real-IP $remote_addr; }
}
